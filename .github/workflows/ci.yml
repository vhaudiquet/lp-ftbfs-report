name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install
      
      - name: Install dependencies
        run: uv sync
      
      - name: Check formatting
        run: uv run poe format --check
      
      - name: Run linter
        run: uv run poe lint
      
      - name: Run type checker
        run: uv run poe typecheck
      
      - name: Run tests
        run: uv run pytest tests/ -v

  frontend-tests:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: "latest"
      
      - name: Set up Python
        run: uv python install
      
      - name: Install Python dependencies
        run: uv sync
      
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      
      - name: Install frontend dependencies
        working-directory: tests/frontend
        run: bun install
      
      - name: Run CI checks (typecheck, lint, format, tests)
        working-directory: tests/frontend
        run: bun run ci

  charm-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57
        with:
          version: "latest"

      - name: Install charm test dependencies
        working-directory: charm
        run: uv sync --group dev

      - name: Run charm unit tests
        working-directory: charm
        run: PYTHONPATH=src uv run python -m pytest tests/ -v

  charm-integration:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d

      - name: Set up LXD
        uses: canonical/setup-lxd@v1
        with:
          channel: latest/stable

      - name: Install microk8s
        run: |
          sudo snap install microk8s --channel=1.36-strict/stable
          sudo usermod -a -G snap_microk8s $USER
          sudo microk8s enable dns hostpath-storage registry

      - name: Install skopeo
        run: sudo apt-get update -qq && sudo apt-get install -y -qq skopeo

      - name: Install juju
        run: sudo snap install juju --classic

      - name: Install charmcraft and rockcraft
        run: |
          sudo snap install charmcraft --classic
          sudo snap install rockcraft --classic

      - name: Bootstrap juju controller
        run: sg snap_microk8s -c "juju bootstrap microk8s mk8s-ftbfs-test --no-switch"

      - name: Run integration tests
        run: sg snap_microk8s -c "./scripts/run-integration-test.sh"
        env:
          JUJU_CONTROLLER: mk8s-ftbfs-test
