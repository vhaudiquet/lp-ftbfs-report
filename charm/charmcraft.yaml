# Build the lp-ftbfs-report Juju charm from this directory.
#
#   charmcraft pack
#
# The resulting .charm is a Juju charm. The OCI image consumed by the
# `oci-image` resource is built separately with rockcraft (see ../rock/).

type: charm

platforms:
  ubuntu@24.04:amd64:

parts:
  charm:
    source: .
    plugin: uv
    build-snaps:
      - astral-uv
